name: Signed Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v<package-version> tag to build and attest."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install exact dependencies
        run: npm ci

      - name: Resolve package version
        id: package
        shell: bash
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Run deterministic release checks
        run: npm run release:check

      - name: Install checksum-locked production scanners
        run: npm run scan -- setup-tools --yes

      - name: Run live release-security gate
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: npm run release:security

      - name: Build and verify release artifacts
        shell: bash
        run: |
          npm run release:artifacts -- --tag "$RELEASE_TAG"
          npm run release:verify

      - name: Generate signed build-provenance attestations
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: .artifacts/release/SHA256SUMS

      - name: Sign the checksum manifest provenance
        id: checksum_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .artifacts/release/SHA256SUMS

      - name: Generate signed CycloneDX SBOM attestations
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            .artifacts/release/tethermark-ce-${{ steps.package.outputs.version }}-source.zip
            .artifacts/release/tethermark-ce-${{ steps.package.outputs.version }}-source.tar.gz
          sbom-path: .artifacts/release/tethermark-ce-${{ steps.package.outputs.version }}.cdx.json

      - name: Upload release artifacts and attestation bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tethermark-ce-${{ steps.package.outputs.version }}-signed-release
          path: |
            .artifacts/release
            ${{ steps.provenance.outputs.bundle-path }}
            ${{ steps.checksum_provenance.outputs.bundle-path }}
            ${{ steps.sbom.outputs.bundle-path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
