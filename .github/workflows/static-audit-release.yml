name: Static Audit Release Gate

permissions:
  contents: read

env:
  AUDIT_LLM_PROVIDER: mock
  AUDIT_LLM_MODEL: mock-agent-runtime
  HARNESS_DISABLE_LEARNING_SCHEDULER: "1"
  HARNESS_DISABLE_LOCAL_BINARIES: "1"
  HARNESS_DISABLE_PYTHON_WORKERS: "1"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_network_e2e:
        description: "Run Pi public-repo static API E2E. Requires GitHub network access."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_ui_e2e:
        description: "Run browser UI E2E. Requires Playwright browser install and GitHub network access."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deterministic-release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --silent

      - name: Run regression tests
        run: npm test --silent

      - name: Check export schemas and snapshots
        run: npm run exports:check --silent

      - name: Check Codex OAuth wiring with isolated first-run profile
        run: npm run smoke:openai-codex-oauth --silent

      - name: Verify fail-closed live validation harness
        run: npm run test:live-validation-harness

  static-pi-api-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_network_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: deterministic-release-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Pi static API E2E
        run: npm run e2e:static-pi --silent

  static-pi-ui-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: deterministic-release-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Pi static UI E2E
        run: npm run e2e:static-pi-ui --silent
