name: Static Audit Release Gate

permissions:
  contents: read

env:
  AUDIT_LLM_PROVIDER: mock
  AUDIT_LLM_MODEL: mock-agent-runtime
  HARNESS_DISABLE_LEARNING_SCHEDULER: "1"
  HARNESS_DISABLE_LOCAL_BINARIES: "1"
  HARNESS_DISABLE_PYTHON_WORKERS: "1"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_network_e2e:
        description: "Run Pi public-repo static API E2E. Requires GitHub network access."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_ui_e2e:
        description: "Run browser UI E2E. Requires Playwright browser install and GitHub network access."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_release_security:
        description: "Run the live Tethermark release-security gate. Expected to fail while documented release blockers remain."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deterministic-release-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --silent

      - name: Run regression tests
        run: npm test --silent

      - name: Check export schemas and snapshots
        run: npm run exports:check --silent

      - name: Check Codex OAuth wiring with isolated first-run profile
        run: npm run smoke:openai-codex-oauth --silent

      - name: Verify fail-closed live validation harness
        run: npm run test:live-validation-harness

  real-static-scanners:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
    env:
      HARNESS_DISABLE_LOCAL_BINARIES: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install checksum-locked production scanners
        run: npm run scan -- setup-tools --yes

      - name: Verify static scanner versions, invocation, rules, and network
        run: npm run scan -- static-doctor --json

      - name: Run real scanners against adversarial fixture
        run: npm run test:static-scanners:real

      - name: Run release security gate against Tethermark
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_release_security == 'true' && runner.os == 'Linux' }}
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: npm run release:security

      - name: Retain scanner evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-scanner-evidence-${{ matrix.os }}
          path: .artifacts/phase4-static-scanner-fixtures.json
          if-no-files-found: warn
          retention-days: 30

      - name: Retain sanitized release security evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_release_security == 'true' && runner.os == 'Linux' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-security-evidence
          path: .artifacts/release-security/report.json
          if-no-files-found: error
          retention-days: 30

  static-pi-api-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_network_e2e == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: deterministic-release-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Pi static API E2E
        run: npm run e2e:static-pi --silent

  static-pi-ui-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_e2e == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: deterministic-release-checks
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npm run setup:browser -- --yes --with-deps --browser ${{ matrix.browser }}

      - name: Run Pi static UI E2E
        env:
          TETHERMARK_STATIC_PI_UI_BROWSER: ${{ matrix.browser }}
        run: npm run e2e:static-pi-ui --silent
