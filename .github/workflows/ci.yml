name: CI

permissions:
  contents: read

env:
  AUDIT_LLM_PROVIDER: mock
  AUDIT_LLM_MODEL: mock-agent-runtime
  HARNESS_DISABLE_LEARNING_SCHEDULER: "1"
  HARNESS_DISABLE_LOCAL_BINARIES: "1"
  HARNESS_DISABLE_PYTHON_WORKERS: "1"

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --silent

      - name: Run regression tests
        run: npm test --silent

      - name: Check export schemas and snapshots
        run: npm run exports:check --silent

      - name: Validate bundled fixtures
        run: npm run scan -- validate-fixtures

      - name: Verify fail-closed live validation harness
        run: npm run test:live-validation-harness

  oss-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native install and uninstall lifecycle
        run: npm run test:install-lifecycle

      - name: Verify pinned toolchain integrity
        run: npm run build --silent && npm run toolchain:check

      - name: Verify fail-closed network exposure policy
        run: npm run test:network-exposure

      - name: Verify credential and untrusted-input boundaries
        run: npm run test:security-boundaries

      - name: Verify release security policy and result parsers
        run: npm run test:release-security

      - name: Smoke test combined OSS launcher
        run: npm run oss:check
