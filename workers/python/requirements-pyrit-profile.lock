# These wheels are installed into an isolated target directory with --no-deps.
# The adapter executes PyRIT's public SeedPrompt and Score contracts plus the
# official ExactTextMatching implementation. The full PyRIT CLI, memory,
# target, media, dataset, Azure, and transformer stacks are intentionally not
# installed.

